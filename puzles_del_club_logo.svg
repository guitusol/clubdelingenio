<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filtros de Relieve y Resplandor -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.8" />
    </filter>

    <!-- Degradados Metálicos y de Fondo -->
    <radialGradient id="slate-bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e232d" />
      <stop offset="65%" stop-color="#101318" />
      <stop offset="100%" stop-color="#06070a" />
    </radialGradient>

    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="gold-piece" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="cyan-piece" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- FONDO CIRCULAR MEDALLÓN -->
  <circle cx="256" cy="256" r="250" fill="url(#slate-bg)" filter="url(#drop-shadow)" />

  <!-- MARCO DE ORO TALLADO Y ANILLOS -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#gold-rim)" stroke-width="8" />
  <circle cx="256" cy="256" r="234" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,6" opacity="0.6" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#gold-rim)" stroke-width="3" />
  <circle cx="256" cy="256" r="162" fill="none" stroke="url(#gold-rim)" stroke-width="2" opacity="0.4" />

  <!-- TRAYECTORIA CURVA PARA TEXTO SUPERIOR -->
  <path id="text-arc-top" d="M 70,256 A 186,186 0 1,1 442,256" fill="none" />
  <text fill="url(#gold-rim)" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="900" letter-spacing="6">
    <textPath href="#text-arc-top" startOffset="50%" text-anchor="middle">
      PUZLES DEL CLUB
    </textPath>
  </text>

  <!-- TRAYECTORIA CURVA PARA TEXTO INFERIOR -->
  <path id="text-arc-bottom" d="M 80,256 A 176,176 0 0,0 432,256" fill="none" />
  <text fill="#fbbf24" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" letter-spacing="4" opacity="0.85">
    <textPath href="#text-arc-bottom" startOffset="50%" text-anchor="middle">
      COGNITIVE PUZZLE GAME
    </textPath>
  </text>

  <!-- ESTRELLAS Y ORNAMENTOS -->
  <g fill="#f59e0b" opacity="0.9">
    <polygon points="256,448 260,458 270,459 262,466 265,476 256,470 247,476 250,466 242,459 252,458" />
    <circle cx="78" cy="256" r="4" />
    <circle cx="434" cy="256" r="4" />
  </g>

  <!-- PIEZA 1: ORO RADIANTE (IZQUIERDA / INFERIOR) -->
  <g filter="url(#gold-glow)">
    <!-- Silueta de la pieza dorada con pestañas macho y hembra entrelazadas -->
    <path d="
      M 160,200
      L 195,200
      C 192,185 200,172 215,172
      C 230,172 238,185 235,200
      L 270,200
      L 270,235
      C 285,232 298,240 298,255
      C 298,270 285,278 270,275
      L 270,310
      L 235,310
      C 238,325 230,338 215,338
      C 200,338 192,325 195,310
      L 160,310
      L 160,275
      C 145,278 132,270 132,255
      C 132,240 145,232 160,235
      Z
    " fill="url(#gold-piece)" stroke="#fef08a" stroke-width="4" stroke-linejoin="round" />
    <!-- Brillo interno -->
    <path d="M 164,204 L 192,204" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- PIEZA 2: CIAN NEÓN LUMINOSO (DERECHA / SUPERIOR, ENCAJADA PERFECTAMENTE) -->
  <g filter="url(#cyan-glow)">
    <path d="
      M 270,200
      L 305,200
      C 302,185 310,172 325,172
      C 340,172 348,185 345,200
      L 380,200
      L 380,235
      C 395,232 408,240 408,255
      C 408,270 395,278 380,275
      L 380,310
      L 345,310
      C 348,325 340,338 325,338
      C 310,338 302,325 305,310
      L 270,310
      L 270,275
      C 285,278 298,270 298,255
      C 298,240 285,232 270,235
      Z
    " fill="url(#cyan-piece)" stroke="#bae6fd" stroke-width="4" stroke-linejoin="round" />
    <!-- Brillo interno -->
    <path d="M 274,204 L 302,204" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- RESPLANDOR CENTRAL EN LA COSTURA DE ACOPLE -->
  <circle cx="270" cy="255" r="18" fill="#ffffff" opacity="0.35" filter="url(#cyan-glow)" />
</svg>
