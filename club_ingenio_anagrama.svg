<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Fondo protector circular oscuro opcional -->
  <circle cx="50" cy="50" r="48" fill="#070a13" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1" />
  <!-- Escudo exterior nobiliario -->
  <path d="M50 8 L84 21 C84 52 66 79 50 89 C34 79 16 52 16 21 Z" stroke="url(#goldGrad)" stroke-width="2.5" fill="#0b1329" fill-opacity="0.9" />
  <!-- Laberinto interior geométrico (Mente / Lógica) -->
  <polygon points="50,22 73,35 73,63 50,76 27,63 27,35" stroke="url(#goldGrad)" stroke-width="1.8" />
  <!-- Núcleo poliédrico de ingenio (Gema de pensamiento) -->
  <polygon points="50,30 67,40 67,60 50,70 33,60 33,40" stroke="url(#cyanGrad)" stroke-width="1.5" />
  <circle cx="50" cy="50" r="4" fill="#38bdf8" filter="url(#glow)" />
  <line x1="50" y1="30" x2="50" y2="70" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.8" />
  <line x1="33" y1="40" x2="67" y2="60" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.8" />
  <line x1="33" y1="60" x2="67" y2="40" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.8" />
</svg>
