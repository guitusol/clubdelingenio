<svg viewBox="0 0 100 100" class="rubik-cube-svg" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes y efectos Dark Luxury -->
    <filter id="cubeDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="stkWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="stkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="stkRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="stkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="stkOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="stkYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Chasis y biseles de obsidiana del Cubo -->
  <g filter="url(#cubeDropShadow)">
    <polygon points="50,8 88,30 88,72 50,94 12,72 12,30" fill="#090d16" stroke="#1e293b" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- CARA SUPERIOR (BLANCA / PLATA) -->
  <g id="face-up">
    <!-- Fila 0 -->
    <polygon points="50.0,11.2 59.7,16.8 50.0,22.4 40.3,16.8" fill="url(#stkWhite)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="62.1,18.1 71.8,23.7 62.1,29.3 52.4,23.7" fill="url(#stkWhite)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="74.2,25.0 83.9,30.6 74.2,36.2 64.5,30.6" fill="url(#stkWhite)" stroke="#090d16" stroke-width="1.2"/>

    <!-- Fila 1 -->
    <polygon points="37.9,18.1 47.6,23.7 37.9,29.3 28.2,23.7" fill="url(#stkWhite)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="50.0,25.0 59.7,30.6 50.0,36.2 40.3,30.6" fill="url(#stkWhite)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="62.1,31.9 71.8,37.5 62.1,43.1 52.4,37.5" fill="url(#stkWhite)" stroke="#090d16" stroke-width="1.2"/>

    <!-- Fila 2 -->
    <polygon points="25.8,25.0 35.5,30.6 25.8,36.2 16.1,30.6" fill="url(#stkWhite)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="37.9,31.9 47.6,37.5 37.9,43.1 28.2,37.5" fill="url(#stkWhite)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="50.0,38.8 59.7,44.4 50.0,50.0 40.3,44.4" fill="url(#stkWhite)" stroke="#090d16" stroke-width="1.2"/>
  </g>

  <!-- CARA IZQUIERDA (VERDE ESMERALDA) -->
  <g id="face-left">
    <!-- Columna 0 -->
    <polygon points="14.8,33.5 24.5,39.1 24.5,50.3 14.8,44.7" fill="url(#stkGreen)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="14.8,47.0 24.5,52.6 24.5,63.8 14.8,58.2" fill="url(#stkGreen)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="14.8,60.5 24.5,66.1 24.5,77.3 14.8,71.7" fill="url(#stkGreen)" stroke="#090d16" stroke-width="1.2"/>

    <!-- Columna 1 -->
    <polygon points="26.9,40.4 36.6,46.0 36.6,57.2 26.9,51.6" fill="url(#stkGreen)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="26.9,53.9 36.6,59.5 36.6,70.7 26.9,65.1" fill="url(#stkGreen)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="26.9,67.4 36.6,73.0 36.6,84.2 26.9,78.6" fill="url(#stkGreen)" stroke="#090d16" stroke-width="1.2"/>

    <!-- Columna 2 -->
    <polygon points="39.0,47.3 48.7,52.9 48.7,64.1 39.0,58.5" fill="url(#stkGreen)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="39.0,60.8 48.7,66.4 48.7,77.6 39.0,72.0" fill="url(#stkGreen)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="39.0,74.3 48.7,79.9 48.7,91.1 39.0,85.5" fill="url(#stkGreen)" stroke="#090d16" stroke-width="1.2"/>
  </g>

  <!-- CARA DERECHA (ROJO CARMESÍ) -->
  <g id="face-right">
    <!-- Columna 0 -->
    <polygon points="51.3,52.9 61.0,47.3 61.0,58.5 51.3,64.1" fill="url(#stkRed)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="51.3,66.4 61.0,60.8 61.0,72.0 51.3,77.6" fill="url(#stkRed)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="51.3,79.9 61.0,74.3 61.0,85.5 51.3,91.1" fill="url(#stkRed)" stroke="#090d16" stroke-width="1.2"/>

    <!-- Columna 1 -->
    <polygon points="63.4,46.0 73.1,40.4 73.1,51.6 63.4,57.2" fill="url(#stkRed)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="63.4,59.5 73.1,53.9 73.1,65.1 63.4,70.7" fill="url(#stkRed)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="63.4,73.0 73.1,67.4 73.1,78.6 63.4,84.2" fill="url(#stkRed)" stroke="#090d16" stroke-width="1.2"/>

    <!-- Columna 2 -->
    <polygon points="75.5,39.1 85.2,33.5 85.2,44.7 75.5,50.3" fill="url(#stkRed)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="75.5,52.6 85.2,47.0 85.2,58.2 75.5,63.8" fill="url(#stkRed)" stroke="#090d16" stroke-width="1.2"/>
    <polygon points="75.5,66.1 85.2,60.5 85.2,71.7 75.5,77.3" fill="url(#stkRed)" stroke="#090d16" stroke-width="1.2"/>
  </g>
</svg>
